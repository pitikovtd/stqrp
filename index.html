<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25.09.2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-variant-numeric: tabular-nums;
    color: #e8e8e8;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    animation: fade 1.2s ease both;
  }

  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .timer {
    display: flex;
    align-items: baseline;
    gap: clamp(0.35rem, 1.4vw, 1.1rem);
    font-size: clamp(2rem, 11vw, 8rem);
    font-weight: 200;
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .num {
    display: inline-block;
    min-width: 2ch;
    text-align: center;
  }

  .sep {
    opacity: 0.22;
    font-weight: 100;
    transform: translateY(-0.04em);
  }

  /* По завершении — лёгкое затухание, без текста */
  .timer.done { opacity: 0.25; transition: opacity 2s ease; }
</style>
</head>
<body>

  <div class="timer" id="timer">
    <span class="num" id="days">00</span>
    <span class="sep">:</span>
    <span class="num" id="hours">00</span>
    <span class="sep">:</span>
    <span class="num" id="minutes">00</span>
    <span class="sep">:</span>
    <span class="num" id="seconds">00</span>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

<script>
  /* ---------- Таймер ---------- */
  // 25 сентября 2026, 20:00 — локальное время компьютера пользователя
  const target = new Date(2026, 8, 25, 20, 0, 0);

  const el = {
    days:    document.getElementById('days'),
    hours:   document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
  };
  const timerEl = document.getElementById('timer');

  const pad = n => String(n).padStart(2, '0');
  let done = false;

  function tick() {
    const diff = target - new Date();

    if (diff <= 0) {
      if (!done) {
        done = true;
        el.days.textContent = el.hours.textContent =
        el.minutes.textContent = el.seconds.textContent = '00';
        timerEl.classList.add('done');
      }
      return;
    }

    const s = Math.floor(diff / 1000);
    el.days.textContent    = pad(Math.floor(s / 86400));
    el.hours.textContent   = pad(Math.floor((s % 86400) / 3600));
    el.minutes.textContent = pad(Math.floor((s % 3600) / 60));
    el.seconds.textContent = pad(s % 60);
  }

  tick();
  setInterval(tick, 1000);

  /* ---------- Музыка ---------- */
  const music = document.getElementById('bgMusic');
  music.volume = 0.45;

  let musicStarted = false;

  function startMusic() {
    if (musicStarted) return;
    musicStarted = true;
    music.play().catch(() => {});
    window.removeEventListener('pointerdown', startMusic);
    window.removeEventListener('keydown', startMusic);
    window.removeEventListener('touchstart', startMusic);
  }

  // Автовоспроизведение браузеры блокируют —
  // запускаем при первом касании / клике / клавише в любом месте страницы
  window.addEventListener('pointerdown', startMusic);
  window.addEventListener('keydown', startMusic);
  window.addEventListener('touchstart', startMusic, { passive: true });
</script>
</body>
</html>

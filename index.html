<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обратный отсчёт</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    overflow: hidden;
  }

  .container {
    text-align: center;
    padding: 2rem;
    z-index: 1;
  }

  h1 {
    font-size: clamp(1.2rem, 4vw, 2rem);
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 2rem;
    opacity: 0.85;
  }

  .target-date {
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    letter-spacing: 0.15em;
    opacity: 0.6;
    margin-bottom: 2.5rem;
  }

  .timer {
    display: flex;
    gap: clamp(0.5rem, 2vw, 1.5rem);
    justify-content: center;
    flex-wrap: wrap;
  }

  .unit {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: clamp(0.8rem, 3vw, 1.5rem) clamp(1rem, 4vw, 2rem);
    min-width: clamp(70px, 18vw, 120px);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s ease;
  }

  .unit:hover {
    transform: translateY(-4px);
  }

  .value {
    font-size: clamp(1.8rem, 8vw, 3.5rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff, #9d9dff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
  }

  .label {
    font-size: clamp(0.6rem, 1.8vw, 0.85rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: 0.6rem;
  }

  .finished {
    font-size: clamp(1.5rem, 6vw, 3rem);
    font-weight: 700;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* Декоративные светящиеся круги */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    pointer-events: none;
  }
  .glow-1 {
    width: 400px; height: 400px;
    background: #6a11cb;
    top: -120px; left: -120px;
  }
  .glow-2 {
    width: 350px; height: 350px;
    background: #2575fc;
    bottom: -100px; right: -100px;
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="container">
    <h1>Обратный отсчёт</h1>
    <p class="target-date">до 19.09.2026, 10:00</p>

    <div class="timer" id="timer">
      <div class="unit">
        <div class="value" id="days">--</div>
        <div class="label">Дней</div>
      </div>
      <div class="unit">
        <div class="value" id="hours">--</div>
        <div class="label">Часов</div>
      </div>
      <div class="unit">
        <div class="value" id="minutes">--</div>
        <div class="label">Минут</div>
      </div>
      <div class="unit">
        <div class="value" id="seconds">--</div>
        <div class="label">Секунд</div>
      </div>
    </div>
  </div>

<script>
  // Дата задаётся в ЛОКАЛЬНОМ времени компьютера пользователя
  const targetDate = new Date(2026, 8, 19, 10, 0, 0); // месяц 8 = сентябрь (0-индексация)

  const el = {
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
  };

  const timerEl = document.getElementById('timer');
  let finished = false;

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function update() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
      if (!finished) {
        finished = true;
        timerEl.innerHTML = '<div class="finished">Время пришло! 🎉</div>';
      }
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    el.days.textContent = days;
    el.hours.textContent = pad(hours);
    el.minutes.textContent = pad(minutes);
    el.seconds.textContent = pad(seconds);
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
